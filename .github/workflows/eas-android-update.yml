name: Signed Android update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - app/**
      - package.json
      - .github/workflows/eas-android-update.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --legacy-peer-deps
      - name: Build locally with existing EAS signing key
        run: eas build --platform android --profile preview --local --non-interactive --output Master-Hub-1.1.1-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Master-Hub-1.1.1-signed
          path: Master-Hub-1.1.1-signed.apk
          if-no-files-found: error
