name: Deploy EAS Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/api/**"
      - "app/v1/**"
      - "app/go/**"
      - "app/privacy.js"
      - "app/terms.js"
      - ".github/workflows/eas-hosting.yml"

concurrency:
  group: eas-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LIYA_DEVICE_TOKEN: ${{ secrets.LIYA_DEVICE_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REDIRECT_URI: https://vianer-assistant.expo.app/api/youtube/callback
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      PINTEREST_REDIRECT_URI: https://vianer-assistant.expo.app/api/pinterest/callback
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_REDIRECT_URI: https://vianer-assistant.expo.app/api/instagram/callback
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      SUPABASE_URL: https://ceozpugxrwgblkwtxiew.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_1AhIOiv0elKK_2wWnaLs6w_z8lWl0M2
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ] || [ -z "$OPENAI_API_KEY" ] || [ -z "$LIYA_DEVICE_TOKEN" ]; then
            echo "EXPO_TOKEN, OPENAI_API_KEY and LIYA_DEVICE_TOKEN repository secrets are required."
            exit 1
          fi

      - name: Checkout current main
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Sync protected server environment
        run: |
          eas env:delete production --variable-name OPENAI_API_KEY --scope project --non-interactive || true
          eas env:delete production --variable-name LIYA_DEVICE_TOKEN --scope project --non-interactive || true
          eas env:delete production --variable-name YOUTUBE_CLIENT_ID --scope project --non-interactive || true
          eas env:delete production --variable-name YOUTUBE_CLIENT_SECRET --scope project --non-interactive || true
          eas env:delete production --variable-name YOUTUBE_REDIRECT_URI --scope project --non-interactive || true
          eas env:delete production --variable-name PINTEREST_APP_ID --scope project --non-interactive || true
          eas env:delete production --variable-name PINTEREST_APP_SECRET --scope project --non-interactive || true
          eas env:delete production --variable-name PINTEREST_REDIRECT_URI --scope project --non-interactive || true
          eas env:delete production --variable-name INSTAGRAM_APP_ID --scope project --non-interactive || true
          eas env:delete production --variable-name INSTAGRAM_APP_SECRET --scope project --non-interactive || true
          eas env:delete production --variable-name INSTAGRAM_REDIRECT_URI --scope project --non-interactive || true
          eas env:delete production --variable-name TELEGRAM_BOT_TOKEN --scope project --non-interactive || true
          eas env:delete production --variable-name TELEGRAM_CHANNEL_ID --scope project --non-interactive || true
          eas env:delete production --variable-name SUPABASE_URL --scope project --non-interactive || true
          eas env:delete production --variable-name SUPABASE_PUBLISHABLE_KEY --scope project --non-interactive || true
          eas env:set --name OPENAI_API_KEY --value "$OPENAI_API_KEY" --environment production --visibility sensitive --non-interactive
          eas env:set --name LIYA_DEVICE_TOKEN --value "$LIYA_DEVICE_TOKEN" --environment production --visibility sensitive --non-interactive
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ]; then
            eas env:set --name YOUTUBE_CLIENT_ID --value "$YOUTUBE_CLIENT_ID" --environment production --visibility sensitive --non-interactive
            eas env:set --name YOUTUBE_CLIENT_SECRET --value "$YOUTUBE_CLIENT_SECRET" --environment production --visibility sensitive --non-interactive
            eas env:set --name YOUTUBE_REDIRECT_URI --value "$YOUTUBE_REDIRECT_URI" --environment production --visibility plaintext --non-interactive
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            eas env:set --name TELEGRAM_BOT_TOKEN --value "$TELEGRAM_BOT_TOKEN" --environment production --visibility sensitive --non-interactive
            eas env:set --name TELEGRAM_CHANNEL_ID --value "${TELEGRAM_CHANNEL_ID:-@masterpick_georgia}" --environment production --visibility plaintext --non-interactive
          fi
          if [ -n "$PINTEREST_APP_ID" ] && [ -n "$PINTEREST_APP_SECRET" ]; then
            eas env:set --name PINTEREST_APP_ID --value "$PINTEREST_APP_ID" --environment production --visibility sensitive --non-interactive
            eas env:set --name PINTEREST_APP_SECRET --value "$PINTEREST_APP_SECRET" --environment production --visibility sensitive --non-interactive
            eas env:set --name PINTEREST_REDIRECT_URI --value "$PINTEREST_REDIRECT_URI" --environment production --visibility plaintext --non-interactive
          fi
          if [ -n "$INSTAGRAM_APP_ID" ] && [ -n "$INSTAGRAM_APP_SECRET" ]; then
            eas env:set --name INSTAGRAM_APP_ID --value "$INSTAGRAM_APP_ID" --environment production --visibility sensitive --non-interactive
            eas env:set --name INSTAGRAM_APP_SECRET --value "$INSTAGRAM_APP_SECRET" --environment production --visibility sensitive --non-interactive
            eas env:set --name INSTAGRAM_REDIRECT_URI --value "$INSTAGRAM_REDIRECT_URI" --environment production --visibility plaintext --non-interactive
          fi
          eas env:set --name SUPABASE_URL --value "$SUPABASE_URL" --environment production --visibility plaintext --non-interactive
          eas env:set --name SUPABASE_PUBLISHABLE_KEY --value "$SUPABASE_PUBLISHABLE_KEY" --environment production --visibility plaintext --non-interactive

      - name: Export web app and API routes
        run: npx expo export --platform web

      - name: Deploy to EAS Hosting production
        run: eas deploy --prod --environment production --non-interactive

      - name: Verify Liya neural voice
        run: |
          status=$(curl --silent --show-error --output /tmp/liya-voice.mp3 --write-out "%{http_code}" \
            --request POST "https://vianer-assistant.expo.app/api/liya/speech" \
            --header "Authorization: Bearer $LIYA_DEVICE_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"text":"Лия готова к работе."}')
          test "$status" = "200"
          test "$(wc -c < /tmp/liya-voice.mp3)" -gt 1000
