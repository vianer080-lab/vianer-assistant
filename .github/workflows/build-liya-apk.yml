name: Build Liya Android APK

concurrency:
  group: liya-android-stable-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "liya-android/**"
      - ".github/workflows/build-liya-apk.yml"
  push:
    branches: [main]
    paths:
      - "liya-android/**"
      - ".github/workflows/build-liya-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable Liya signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: liya-android-signing-v1
      - name: Require the existing Liya signing key
        run: |
          test -f ~/.android/debug.keystore || {
            echo "Stable signing key is unavailable; refusing to create an incompatible update."
            exit 1
          }
      - name: Build debug APK
        env:
          VOSK_MODEL_URL: https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
        run: |
          mkdir -p liya-android/app/src/main/assets/model-ru
          curl -L --fail --retry 3 -o /tmp/vosk-ru.zip "$VOSK_MODEL_URL"
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru
          cp -R /tmp/vosk-ru/vosk-model-small-ru-0.22/. liya-android/app/src/main/assets/model-ru/
      - name: Compile debug APK
        working-directory: liya-android
        run: >-
          gradle --no-daemon :app:assembleDebug
          -PLIYA_API_URL="${{ secrets.LIYA_API_URL }}"
          -PLIYA_DEVICE_TOKEN="${{ secrets.LIYA_DEVICE_TOKEN }}"
      - uses: actions/upload-artifact@v4
        with:
          name: liya-android-apk
          path: liya-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
