name: Build Liya Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "liya-android/**"
      - ".github/workflows/build-liya-apk.yml"
  push:
    branches: [main]
    paths:
      - "liya-android/**"
      - ".github/workflows/build-liya-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: liya-android
        run: >-
          gradle --no-daemon :app:assembleDebug
          -PLIYA_API_URL="${{ secrets.LIYA_API_URL }}"
          -PLIYA_DEVICE_TOKEN="${{ secrets.LIYA_DEVICE_TOKEN }}"
      - uses: actions/upload-artifact@v4
        with:
          name: liya-android-apk
          path: liya-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
