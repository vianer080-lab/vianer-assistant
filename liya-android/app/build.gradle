plugins {
    id "com.android.application"
}

def liyaApiUrl = providers.gradleProperty("LIYA_API_URL").orElse("").get()
def liyaDeviceToken = providers.gradleProperty("LIYA_DEVICE_TOKEN").orElse("").get()

android {
    namespace "com.vianerapps.liya"
    compileSdk 35

    defaultConfig {
        applicationId "com.vianerapps.liya"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "0.8.0"
        buildConfigField "String", "LIYA_API_URL", "\"${liyaApiUrl}\""
        buildConfigField "String", "LIYA_DEVICE_TOKEN", "\"${liyaDeviceToken}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "com.google.mlkit:translate:17.0.3"
}
